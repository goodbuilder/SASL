name: quality

on:
  push:
  pull_request:

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated and machine-local tracked state
        # Remove --allow-existing-debt after the historical recording/profiler
        # files reported by this command are untracked in a dedicated cleanup.
        run: python3 tools/check_repository_policy.py --allow-existing-debt
      - name: Reject user-home and dated-checkout paths
        run: python3 tools/check_portable_paths.py

  python-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements/dev.txt
      - name: Shared geometry and complete Workstation regression
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest
          apps/StereoWIRIS/tests/test_coordinate_contract.py
          apps/StereoWIRIS/tests/test_stereo_geometry_common.py
          apps/StereoWIRIS/tests/test_triangulation.py
          apps/Workstation/tests
