name: quality

on:
  push:
  pull_request:

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated and machine-local tracked state
        # Remove --allow-existing-debt after the historical recording/profiler
        # files reported by this command are untracked in a dedicated cleanup.
        run: python3 scripts/check_repository_policy.py --allow-existing-debt

  python-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements/dev.txt
      - name: Shared and UI contract tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest
          StereoWIRIS/tests/test_coordinate_contract.py
          StereoWIRIS/tests/test_stereo_geometry_common.py
          StereoWIRIS/tests/test_triangulation.py
          StereoWIRIS/tests/test_workstation.py
