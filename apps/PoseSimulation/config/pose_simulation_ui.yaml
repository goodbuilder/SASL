# rqt reads this file through POSE_SIMULATION_UI_CONFIG.  It is deliberately
# separate from the ROS parameter file so nested threshold maps are not passed
# to a node as undeclared ROS parameters.
namespace: /pose_simulation
trend_buffer_size: 6000
default_window_s: 30.0

# These are external read-only camera streams published by the Simulation
# camera bridge/overlay.  PoseSimulation does not create or modify them.
camera:
  enabled: true
  left_topic: /left_camera/detection_image
  right_topic: /right_camera/detection_image
  message_type: sensor_msgs/msg/Image
  display_max_hz: 20.0

visualization:
  ray_mode: normalized
  normalized_ray_length_m: 50.0
  show_detail_axes: false
  axis_length_m: 12.0

# No project-approved numeric pass/fail thresholds exist in this Phase.  The
# rqt UI reports available values and never invents PASS.
ui_thresholds:
  relative_yaw_error_deg:
    warning: null
    failure: null
  optical_axis_error_deg:
    warning: null
    failure: null
  rtk_los_error_deg:
    warning: null
    failure: null
  time_residual_ms:
    warning: null
    failure: null
  baseline_length_error_m:
    warning: null
    failure: null
  baseline_direction_error_deg:
    warning: null
    failure: null
